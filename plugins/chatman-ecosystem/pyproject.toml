# Configuration only -- this directory is a Claude Code plugin, not a Python
# package. There is deliberately no [build-system]: nothing here is installable,
# and `pythonpath` below is what makes `import phase` work in tests without the
# sys.path manipulation the scripts do at import time.
#
# Runtime dependency policy
# -------------------------
# The human-facing CLI layer uses typer, dspy, blake3, fastapi/uvicorn (the
# gemma_swarm.py A2A server), and pm4py (conformance_check.py). The *hook*
# path must not use any of these: hooks are the protected-actuation fence,
# they are invoked as bare `python3 loop.py hook` by the Claude Code runtime,
# and a missing third-party import there would take the fence down rather
# than merely degrade a command. Scripts on the hook path therefore dispatch
# `hook` from sys.argv before importing anything third-party.
#
#   runtime (CLI only): typer, dspy, blake3, fastapi, uvicorn, pm4py
#   runtime (hooks):    standard library only
#   development:        pytest, ruff
#
# `uv` manages this dependency set for reproducibility (`uv lock` / `uv run`
# below) without turning this plugin directory into an installable package --
# still no [build-system] table.

[project]
name = "chatman-ecosystem-scripts"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "typer",
    "dspy",
    "blake3",
    "fastapi",
    "uvicorn",
    "pm4py",
]

# Not an installable package -- no [build-system] above. Tells uv to manage
# this pyproject.toml's dependency set (lock/sync/run) without trying to
# build/install this directory itself as a wheel.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-q --strict-markers"
markers = [
    "needs_cargo: requires a built ferroplan-mcp binary (deselected by default)",
]

[tool.ruff]
line-length = 100
# 3.11 is the realistic floor for whatever Python a user's Claude Code has.
# Local development runs 3.14; pinning the floor here is what surfaces any
# accidental 3.12+ syntax in CI rather than in a user's session.
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
]
