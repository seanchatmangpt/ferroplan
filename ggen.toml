# ferroplan WASI JSON-ABI projection (wasi-json-abi-pack). Facts: ontology/ferroplan-wasm.ttl.
# Beam-host modules are generated by crates/ferroplan-wasm/ggen.toml (frontmatter-mode project).
[project]
name = "ferroplan-wasm"
version = "0.1.0"
description = "ferroplan WASI JSON-ABI registry projection"

[ontology]
source = "ontology/ferroplan-wasm.ttl"
imports = [
  "plugins/chatman-ecosystem/ontology/ferroplan-domain.ttl",
  "plugins/chatman-ecosystem/ontology/ferroplan-experience.ttl",
  "ontology/ferroplan-options.ttl",
  "ontology/ferroplan-crates.ttl",
  "ontology/ferroplan-self-host.ttl",
]

[[packs]]
name = "wasi-json-abi-pack"
registry = "local"
path = "../ggen-marketplace/packs/wasi-json-abi-pack"

[[generation.rules]]
name = "wasm-capability-registry"
query    = { pack = "wasi-json-abi-pack", output = "queries", file = "registry.rq" }
template = { file = "ontology/templates/wasm_capability_registry.json.tmpl" }
output_file = "crates/ferroplan-wasm/registry/capability-registry.json"
mode = "Overwrite"

[[generation.rules]]
name = "wasm-op-examples"
query    = { pack = "wasi-json-abi-pack", output = "queries", file = "examples.rq" }
template = { pack = "wasi-json-abi-pack", output = "templates", file = "wasm_op_examples.json.tmpl" }
output_file = "crates/ferroplan-wasm/registry/op-examples.json"
mode = "Overwrite"

[[generation.rules]]
name = "wasm-artifacts"
query    = { pack = "wasi-json-abi-pack", output = "queries", file = "artifacts.rq" }
template = { pack = "wasi-json-abi-pack", output = "templates", file = "wasm_artifacts.sha256.tmpl" }
output_file = "crates/ferroplan-wasm/registry/ARTIFACTS.sha256"
mode = "Create"

# ---- merged lane stanzas (L1-mcp, L11, L5, L7). L4 ci is a nested project: scripts/ci_gen.sh --check ----

# L1-mcp rule stanza. Needs the two plugin ontologies loaded in the manifest that hosts this rule:
#   [ontology] source = "plugins/chatman-ecosystem/ontology/ferroplan-domain.ttl"
#              imports = ["plugins/chatman-ecosystem/ontology/ferroplan-experience.ttl"]
# (verified in a scratch project: idempotent, output byte-identical to committed file).
# Ledger: UNSUPPORTED(generator-capability: rust-const-table) -- no pack; local template.
[[generation.rules]]
name = "mcp-tool-ontology"
query = { file = "ontology/mcp-tool-ontology.rq" }
template = { file = "ontology/mcp-tool-ontology.rs.tera" }
output_file = "crates/ferroplan-mcp/src/generated/tool_ontology.rs"
mode = "Overwrite"

# L11 crate roster (R11). Local templates: pack NONE -> UNSUPPORTED(generator-capability: local-template + marker-region splice).
# README region is spliced by ontology/ferroplan-crates.gate.py --write from the generated fragment.
[[generation.rules]]
name = "crate-roster-readme-fragment"
query = { file = "ontology/ferroplan-crates.rq" }
template = { file = "ontology/ferroplan-crates.readme.tmpl" }
output_file = "ontology/ferroplan-crates.readme.md"
mode = "Overwrite"

[[generation.rules]]
name = "crate-roster-book"
query = { file = "ontology/ferroplan-crates.rq" }
template = { file = "ontology/ferroplan-crates.book.tmpl" }
output_file = "book/src/crates.md"
mode = "Overwrite"

# Append to root ggen.toml (owner: L0). Local template: pack NONE.
# Ledger: UNSUPPORTED(generator-capability: clap ValueEnum + defaults table).
[[generation.rules]]
name = "cli-options"
query    = { file = "crates/ferroplan-cli/ggen/options.rq" }
template = { file = "crates/ferroplan-cli/ggen/options.rs.tmpl" }
output_file = "crates/ferroplan-cli/src/generated/options.rs"
mode = "Overwrite"

# L7 (R7): self-host PDDL world projection. Local templates (UNSUPPORTED generator-capability: pddl-text).
# Source: ontology/ferroplan-self-host.ttl -- must be reachable from [ontology] (source or imports) in root ggen.toml.
[[generation.rules]]
name = "self-host-pddl"
query    = { file = "plugins/chatman-ecosystem/world/queries/self-host-domain.rq" }
template = { file = "plugins/chatman-ecosystem/world/templates/self-host-domain.pddl.tmpl" }
output_file = "plugins/chatman-ecosystem/world/ferroplan-self-host-domain.pddl"
mode = "Overwrite"

[[generation.rules]]
name = "self-host-tables"
query    = { file = "plugins/chatman-ecosystem/world/queries/self-host-tables.rq" }
template = { file = "plugins/chatman-ecosystem/world/templates/world_tables.py.tmpl" }
output_file = "plugins/chatman-ecosystem/scripts/world_tables.py"
mode = "Overwrite"
