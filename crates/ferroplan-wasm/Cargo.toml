[package]
name = "ferroplan-wasm"
description = "WASM-smuggled ferroplan — the planner slipped past the sandbox wall, running live in your browser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ferroplan = { path = "../ferroplan" }
# Must match the installed `wasm-bindgen` CLI exactly.
wasm-bindgen = "=0.2.126"
serde_json = "1"
