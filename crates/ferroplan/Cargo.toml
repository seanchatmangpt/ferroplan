[package]
name = "ferroplan"
description = "A fast, data-parallel PDDL and PPDDL planner in Rust — deterministic FF search plus explicit-MDP probabilistic policy synthesis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[dependencies]
# The SAT compilation wing's solver (0.24 Phase 2) — the first wiring of
# the absorbed crate, version-pinned like every other in-workspace dep.
ferroplan-sat = { path = "../ferroplan-sat", version = "0.26.0" }
# HDDL front-end (parse -> ground -> translate) for the `hddl` module's
# planning_runtime entry point. One-way dependency edge -- see the note in
# ferroplan-hddl's Cargo.toml on why the direction is this way, not reversed.
ferroplan-hddl = { path = "../ferroplan-hddl", version = "0.26.0" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
blake3 = "1"
sha2 = "0.10"
schemars = { version = "1.2.2", optional = true }

[features]
# Derives `schemars::JsonSchema` on the public solver-configuration types
# (`Options`, `Mode`, `Search`) so consumers — e.g. an MCP server generating
# tool-input JSON Schema — get a typed schema instead of an opaque `Value`.
# Off by default: crates that don't need it (ferroplan-wasm, ferroplan-cli,
# ferroplan-bevy) don't pay for it.
schema = ["dep:schemars"]

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "planning"
harness = false

[[bench]]
name = "ppddl"
harness = false
