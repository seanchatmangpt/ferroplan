[package]
name = "ferroplan-cli"
description = "Terminal jockey's rig for ferroplan — the `ff` binary, plans compiled at street level"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[[bin]]
name = "ff"
path = "src/main.rs"

[[bin]]
name = "ferroplan-harvest"
path = "src/bin/ferroplan-harvest.rs"

[[bin]]
name = "ferroplan-ppddl"
path = "src/bin/ferroplan-ppddl.rs"

[dependencies]
ferroplan = { path = "../ferroplan", version = "0.28.1" }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = "1"
blake3 = "1"
