[package]
name = "ferroplan-mcp"
description = "MCP servers running the ferroplan wire — planning, self-hosting sessions that persist past the blackout, Chatman admission receipts stamped in the ledger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
# In the publish set since 0.14.0 (library -> cli -> mcp, in that order).
publish = true

[[bin]]
name = "ferroplan-mcp"
path = "src/main.rs"

[dependencies]
ferroplan = { path = "../ferroplan", version = "0.17.0", features = ["schema"] }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = "1"
bcinr-cmca = { version = "26.7.28", features = ["std"] }
rmcp = { version = "2.2.0", features = ["server", "macros", "transport-io", "schemars"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "io-std"] }
schemars = "1.2.2"
