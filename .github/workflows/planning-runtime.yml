  MFW_PLANNER_ORACLE_PYTHONPATH: ${{ github.workspace }}/vendor/mfw-planning-autonomic/oracle
  FERROPLAN_REQUIRE_MFW_ORACLE: "1"
  RUSTC_WRAPPER: ""

jobs:
  planning-runtime:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - name: Checkout exact Ferroplan head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
        
      - name: Assert exact head identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD" || exit 42

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
        
      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Compile projected MFW capsule
        shell: bash
        run: |
          python3 -m compileall -q \
            vendor/mfw-planning-autonomic/oracle \
            vendor/mfw-planning-autonomic/lifecycle \
            scripts/verify_mfw_planning_capsule.py

      - name: Verify MFW source authority capsule
        shell: bash
        run: |
          python3 scripts/verify_mfw_planning_capsule.py > mfw-planning-capsule.verification.json

      - name: Execute complete autonomic planning lifecycle
        shell: bash
        run: |
          python3 -m mfw_autonomic_lifecycle check .autonomic/planning-runtime.lifecycle.json
          python3 -m mfw_autonomic_lifecycle run \
            .autonomic/planning-runtime.lifecycle.json \
            --receipt planning-runtime-lifecycle.receipt.json

      - name: Replay complete read-only lifecycle
