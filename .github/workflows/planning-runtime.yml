name: Planning Runtime Crown

on:
  pull_request:
    paths:
      - "crates/ferroplan/src/planning_runtime.rs"
      - "crates/ferroplan/src/planning_types.rs"
      - "crates/ferroplan/src/lib.rs"
      - "crates/ferroplan/tests/planning_runtime.rs"
      - "crates/ferroplan/tests/planning_types.rs"
      - "crates/ferroplan/tests/mfw_python_oracle.rs"
      - ".autonomic/planning-runtime.lifecycle.json"
      - ".github/workflows/planning-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTC_WRAPPER: ""
  FERROPLAN_REQUIRE_MFW_ORACLE: "1"
  MFW_PLANNER_ORACLE_PYTHONPATH: ${{ github.workspace }}/mfw-ecosystem/tools/mfw-planner-oracle-python/src
  PYTHONPATH: ${{ github.workspace }}/mfw-ecosystem/tools/mfw-planner-oracle-python/src

jobs:
  planning-runtime:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - name: Checkout exact Ferroplan head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Checkout exact MFW autonomic ecosystem
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: seanchatmangpt/mfw
          ref: 1e1566f771d5b661d6bb43e1d103610a5ad4fd33
          path: mfw-ecosystem
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install autonomic lifecycle controller
        run: python -m pip install --disable-pip-version-check ./mfw-ecosystem/tools/mfw-autonomic-lifecycle-python

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Admit and execute complete planning lifecycle
        run: |
          mfw-autonomic-lifecycle check .autonomic/planning-runtime.lifecycle.json
          mfw-autonomic-lifecycle run \
            .autonomic/planning-runtime.lifecycle.json \
            --receipt planning-runtime-lifecycle.receipt.json

      - name: Replay complete read-only lifecycle
        run: |
          mfw-autonomic-lifecycle replay \
            .autonomic/planning-runtime.lifecycle.json \
            planning-runtime-lifecycle.receipt.json \
            > planning-runtime-lifecycle.replay.json

      - name: Upload lifecycle receipts
        uses: actions/upload-artifact@v4
        with:
          name: planning-runtime-lifecycle-receipts
          path: |
            planning-runtime-lifecycle.receipt.json
            planning-runtime-lifecycle.replay.json
          if-no-files-found: error
          retention-days: 30
