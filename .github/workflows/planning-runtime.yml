name: Planning Runtime Crown

on:
  pull_request:
    paths:
      - "crates/ferroplan/src/planning_runtime.rs"
      - "crates/ferroplan/src/planning_types.rs"
      - "crates/ferroplan/src/lib.rs"
      - "crates/ferroplan/tests/planning_runtime.rs"
      - "crates/ferroplan/tests/planning_types.rs"
      - "crates/ferroplan/tests/mfw_python_oracle.rs"
      - ".autonomic/planning-runtime.lifecycle.json"
      - ".github/workflows/planning-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTC_WRAPPER: ""
  FERROPLAN_REQUIRE_MFW_ORACLE: "1"

jobs:
  planning-runtime:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - name: Checkout exact Ferroplan head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Execute pinned MFW autonomic planning lifecycle
        id: autonomic
        uses: seanchatmangpt/mfw/.github/actions/planning-autonomic@df511b2dd6aec591d49bf25f652d46a2d03fc3d1
        with:
          manifest: .autonomic/planning-runtime.lifecycle.json
          receipt: planning-runtime-lifecycle.receipt.json
          replay-receipt: planning-runtime-lifecycle.replay.json

      - name: Verify admitted MFW source identity
        env:
          EXPECTED_MFW_REF: df511b2dd6aec591d49bf25f652d46a2d03fc3d1
          OBSERVED_MFW_REF: ${{ steps.autonomic.outputs.source-ref }}
        run: |
          test "$OBSERVED_MFW_REF" = "$EXPECTED_MFW_REF"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          source = json.loads(Path('mfw-planning-autonomic.source.json').read_text())
          assert source['repository'] == 'seanchatmangpt/mfw'
          assert source['ref'] == os.environ['EXPECTED_MFW_REF']
          PY

      - name: Upload lifecycle receipts
        uses: actions/upload-artifact@v4
        with:
          name: planning-runtime-lifecycle-receipts
          path: |
            planning-runtime-lifecycle.receipt.json
            planning-runtime-lifecycle.replay.json
            mfw-planning-autonomic.source.json
            mfw-planner-oracle.capabilities.json
          if-no-files-found: error
          retention-days: 30
