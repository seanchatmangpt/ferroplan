name: Planning Runtime Crown

on:
  pull_request:
    paths:
      - "crates/ferroplan/src/planning_runtime.rs"
      - "crates/ferroplan/src/planning_types.rs"
      - "crates/ferroplan/src/lib.rs"
      - "crates/ferroplan/tests/planning_runtime.rs"
      - "crates/ferroplan/tests/planning_types.rs"
      - ".github/workflows/planning-runtime.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  RUSTC_WRAPPER: ""

jobs:
  planning-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Manufacture MSRV, compiler, and formatting repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/ferroplan/src/planning_runtime.rs')
          text = path.read_text()
          replacements = {
              'distance.get(&edge.to).is_none_or(|known| next < *known)':
                  'distance.get(&edge.to).map_or(true, |known| next < *known)',
              'best_goal.as_ref().is_none_or(|(best, _)| score < *best)':
                  'best_goal.as_ref().map_or(true, |(best, _)| score < *best)',
              'best.as_ref().is_none_or(|(value, _)| score > *value)':
                  'best.as_ref().map_or(true, |(value, _)| score > *value)',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text)
          PY
          cargo fix -p ferroplan --all-targets --all-features --allow-dirty --allow-staged
          cargo fmt -p ferroplan

      - name: Commit manufactured repairs
        run: |
          if ! git diff --quiet -- crates/ferroplan/src/planning_runtime.rs crates/ferroplan/src/planning_types.rs crates/ferroplan/src/lib.rs crates/ferroplan/tests/planning_runtime.rs crates/ferroplan/tests/planning_types.rs; then
            git config user.name "ferroplan-planning-controller"
            git config user.email "ferroplan-planning-controller@users.noreply.github.com"
            git add crates/ferroplan/src/planning_runtime.rs crates/ferroplan/src/planning_types.rs crates/ferroplan/src/lib.rs crates/ferroplan/tests/planning_runtime.rs crates/ferroplan/tests/planning_types.rs
            git commit -m "fix(planning): preserve Rust 1.74 planner compatibility"
            git push origin "HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"
          fi

      - name: Verify format
        run: cargo fmt -p ferroplan -- --check

      - name: Compile all planner surfaces
        run: cargo check -p ferroplan --all-targets --all-features

      - name: Strict lint
        run: cargo clippy -p ferroplan --all-targets --all-features -- -D warnings

      - name: Execute planning constitution
        run: cargo test -p ferroplan --test planning_types

      - name: Execute every planner family
        run: cargo test -p ferroplan --test planning_runtime

      - name: Execute complete Ferroplan core
        run: cargo test -p ferroplan --all-features
