name: Planning Runtime Crown

on:
  pull_request:
    paths:
      - "crates/ferroplan/src/planning_runtime.rs"
      - "crates/ferroplan/src/planning_types.rs"
      - "crates/ferroplan/src/lib.rs"
      - "crates/ferroplan/tests/planning_runtime.rs"
      - "crates/ferroplan/tests/planning_types.rs"
      - "crates/ferroplan/tests/mfw_python_oracle.rs"
      - ".github/workflows/planning-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTC_WRAPPER: ""
  FERROPLAN_REQUIRE_MFW_ORACLE: "1"
  MFW_PLANNER_ORACLE_PYTHONPATH: ${{ github.workspace }}/mfw-oracle/tools/mfw-planner-oracle-python/src

jobs:
  planning-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact Ferroplan head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Checkout admitted MFW oracle
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: seanchatmangpt/mfw
          ref: 08ad6757842242ccfa1517f084ecabdf82031507
          path: mfw-oracle
          fetch-depth: 1

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Verify MFW oracle source identity
        run: |
          test -f "$MFW_PLANNER_ORACLE_PYTHONPATH/mfw_planner_oracle/oracle.py"
          test -f "$MFW_PLANNER_ORACLE_PYTHONPATH/mfw_planner_oracle/compare.py"
          python3 -m compileall -q \
            "$MFW_PLANNER_ORACLE_PYTHONPATH/mfw_planner_oracle"
          PYTHONPATH="$MFW_PLANNER_ORACLE_PYTHONPATH" \
            python3 -m mfw_planner_oracle capabilities > mfw-oracle-capabilities.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path("mfw-oracle-capabilities.json").read_text())
          assert value["oracle"] == "mfw-python-v1"
          assert len(value["planning_types"]) == 18
          PY

      - name: Verify format
        run: cargo fmt -p ferroplan -- --check

      - name: Compile all planner surfaces
        run: cargo check -p ferroplan --all-targets --all-features

      - name: Strict lint
        run: cargo clippy -p ferroplan --all-targets --all-features -- -D warnings

      - name: Execute planning constitution
        run: cargo test -p ferroplan --test planning_types

      - name: Execute every planner family
        run: cargo test -p ferroplan --test planning_runtime

      - name: Admit every planner through MFW Python oracle
        run: cargo test -p ferroplan --test mfw_python_oracle -- --nocapture

      - name: Execute complete Ferroplan core
        run: cargo test -p ferroplan --all-features

      - name: Refuse uncommitted repair drift
        run: git diff --exit-code
