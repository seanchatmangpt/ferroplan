name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # One bad byte in examples.js and the whole module script goes dark —
      # the page ships with empty dropdowns, nobody the wiser. Parse it cold
      # as a real ES module before we burn a single cycle on the wasm builds.
      - name: Sanity-check the demo module graph
        run: |
          node --input-type=module -e "
            import('./crates/ferroplan-wasm/web/examples.js').then(m => {
              if (!m.DOMAINS || !m.DOMAINS.length) throw new Error('DOMAINS missing/empty');
              console.log(m.DOMAINS.length + ' demo domains OK');
            })"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install mdBook
        run: cargo install mdbook --version "^0.4" --locked
      # The committed numbers ship as-is, no re-run. They're machine-dependent
      # (forged locally per benchmarks/COMPARING.md) — chasing them on a CI
      # runner buys nothing but slow. Regenerate on home iron, commit, done.
      - name: Wire benchmark results into the book
        run: cp benchmarks/results.md book/src/results.md
      - name: Compile the in-browser planner demo (WASM)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.126 --locked
          crates/ferroplan-wasm/build.sh
      - name: Compile the in-browser GUI (Bevy WASM)
        run: crates/ferroplan-bevy/build-wasm.sh
      - name: Bind the book
        run: mdbook build book
      - name: Bundle the WASM demos into the site (/demo/ planner, /gui/ visualizer)
        run: |
          cp -r crates/ferroplan-wasm/web book/book/demo
          cp -r crates/ferroplan-bevy/web book/book/gui
      - uses: actions/upload-pages-artifact@v3
        with:
          path: book/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
