# GENERATED by ggen (github-actions-pack/templates/workflow.yml.tmpl). Do not edit.
# Source of truth: this consumer's own admitted gha:Workflow/gha:Job/gha:Step facts.
name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:


concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


permissions:
  contents: read

env:
  RUSTC_WRAPPER: ""
  CARGO_TERM_COLOR: always

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    name: Route owned evidence
    outputs:
      rust: ${{ steps.route.outputs.rust }}
      plugin: ${{ steps.route.outputs.plugin }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
        
      - id: subject
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          base="${PR_BASE:-$(git rev-parse HEAD^)}"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - id: route
        shell: bash
        run: |
          python3 scripts/ci_router.py --base '${{ steps.subject.outputs.base }}' --head '${{ github.event.pull_request.head.sha || github.sha }}' --report target/ci/ci-route.json

  plugin:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [classify]
    if: needs.classify.outputs.plugin == 'true'
    name: Chatman plugin deep lane
    defaults:
      run:
        working-directory: plugins/chatman-ecosystem

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
        
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
        
      - name: Install verifier tooling
        shell: bash
        run: |
          pip install --quiet pytest ruff coverage typer pydantic jsonschema rdflib pyshacl

      - name: Static and generated projection checks
        shell: bash
        run: |
          ruff check scripts tests
          python -m compileall -q scripts
          for f in scripts/*.sh; do sh -n "$f"; done
          python scripts/generate.py build --check

      - name: Complete plugin tests
        shell: bash
        run: |
          pytest

      - name: Focused Luna evidence
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        shell: bash
        run: |
          python -m pytest -q --junitxml=openai-luna-junit.xml tests/test_openai_luna*.py tests/test_openai_ostar_star.py
          coverage run --branch --source=mcp_client,openai_luna_protocol,openai_luna_runtime,openai_ostar_star,verify_openai_luna -m pytest -q tests/test_openai_luna_unit.py tests/test_openai_luna_contract.py tests/test_openai_luna_property.py tests/test_openai_luna_replay.py tests/test_openai_luna_mutation.py tests/test_openai_luna_security.py tests/test_openai_luna_integration.py tests/test_openai_luna_chaos.py tests/test_openai_luna_verifier.py tests/test_openai_ostar_star.py
          coverage report --fail-under=75
          coverage xml -o openai-luna-coverage.xml
          python scripts/verify_openai_luna.py --junit openai-luna-junit.xml --output openai-luna-verifier.json --python-version '3.11' --static-check ruff --static-check compileall --static-check shell-syntax --static-check coverage

      - name: Upload plugin receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          retention-days: 30
          if-no-files-found: warn
          path: |
            plugins/chatman-ecosystem/openai-luna-junit.xml
            plugins/chatman-ecosystem/openai-luna-verifier.json
            plugins/chatman-ecosystem/openai-luna-coverage.xml
          name: plugin-evidence-${{ github.event.pull_request.head.sha || github.sha }}
        
  rust-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [classify]
    if: needs.classify.outputs.rust == 'true'
    name: Rust core deep lane

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
        
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
          toolchain: stable
        
      - name: Format
        shell: bash
        run: |
          cargo fmt --all -- --check

      - name: Clippy owned native workspace
        shell: bash
        run: |
          cargo clippy --workspace --exclude ferroplan-bevy --all-targets --all-features -- -D warnings

      - name: Test owned native workspace
        shell: bash
        run: |
          cargo test --workspace --exclude ferroplan-bevy

      - name: Heavy IPC regression guards
        shell: bash
        run: |
          cargo test --release -p ferroplan -- --ignored

      - name: Documentation and benchmark compile
        shell: bash
        run: |
          RUSTDOCFLAGS='-D warnings' cargo doc --no-deps --all-features --workspace --exclude ferroplan-bevy
          cargo bench --no-run -p ferroplan

      - name: Drift gates
        shell: bash
        run: |
          python3 scripts/drift_gates.py

      - name: Generator drift (needs ggen + sibling packs)
        shell: bash
        run: |
          # ggen and the ../ggen-marketplace packs are path dependencies that a clean runner does not have.
          # Present: both gates run and fail on drift. Absent: skipped with a notice; the cargo drift tests above still run.
          if command -v ggen >/dev/null 2>&1 && [ -d ../ggen-marketplace/packs ]; then
            scripts/ci_gen.sh --check
            cargo install just --locked
            just wasm-gen-check
          else
            echo "::notice::ggen or ../ggen-marketplace unavailable; skipping ci_gen --check and wasm-gen-check"
          fi

  wasm-pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [classify]
    if: needs.classify.outputs.rust == 'true'
    name: WASM artifact pin
    continue-on-error: true  # advisory until the first green run on a stock runner

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
        
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: wasm32-wasip1
          toolchain: stable
        
      - name: Build wasm32-wasip1 and compare against ontology pin
        shell: bash
        run: |
          cargo install just --locked
          just wasm-build-pin

