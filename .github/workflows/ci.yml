name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Core library + CLI, run through the gauntlet. The Bevy GUI stays dark
  # here — it needs heavy system libraries this runner doesn't carry, so
  # it's built and checked on home turf for now.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy sweep
        run: cargo clippy --workspace --exclude ferroplan-bevy --all-targets --all-features -- -D warnings
      - name: Run the suite
        run: cargo test --workspace --exclude ferroplan-bevy
      # The IPC-benchmark regression guards (espc / ipc5_pref_metric) stay `#[ignore]`d —
      # cut loose from the default `cargo test` (and the publish pre-flight) so multi-minute
      # solves don't drag the fast path down. Released here instead, running ~3x lean.
      - name: Heavy IPC regression guards (release)
        run: cargo test --release -p ferroplan -- --ignored
      - name: Docs build clean
        run: cargo doc --no-deps --all-features --workspace --exclude ferroplan-bevy
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Bench compiles (perf gate)
        run: cargo bench --no-run -p ferroplan

  # The plugin's Python control plane, run in its own quarantine lane —
  # a plugin failure must never hide behind a Rust one.
  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/chatman-ecosystem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Stock the toolbelt
        run: pip install --quiet pytest ruff typer pydantic jsonschema rdflib pyshacl
      - name: Lint sweep
        run: ruff check scripts tests
      - name: Compile every script
        run: python -m compileall -q scripts
      - name: Shell syntax check
        run: for f in scripts/*.sh; do sh -n "$f"; done
      - name: Generated files match source
        run: python3 scripts/generate.py build --check
      - name: Run the suite
        run: pytest

  # The OpenAI/OStar rail runs its own compatibility sweep, evidence sealed
  # on the way out. Deterministic fakes only, dark — no key, no wire out.
  openai-luna-verification:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: plugins/chatman-ecosystem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Stock the focused toolbelt
        run: pip install --quiet pytest ruff coverage
      - name: Focused lint sweep
        run: >-
          ruff check
          scripts/mcp_client.py
          scripts/openai_luna.py
          scripts/openai_luna_protocol.py
          scripts/openai_luna_runtime.py
          scripts/openai_ostar_star.py
          scripts/verify_openai_luna.py
          tests/openai_luna_testkit.py
          tests/test_openai_luna*.py
          tests/test_openai_ostar_star.py
      - name: Compile focused runtime
        run: >-
          python -m compileall -q
          scripts/mcp_client.py
          scripts/openai_luna.py
          scripts/openai_luna_protocol.py
          scripts/openai_luna_runtime.py
          scripts/openai_ostar_star.py
          scripts/verify_openai_luna.py
          tests/openai_luna_testkit.py
          tests/test_openai_luna*.py
          tests/test_openai_ostar_star.py
      - name: Shell syntax check
        run: for f in scripts/*.sh; do sh -n "$f"; done
      - name: Full focused ladder
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: >-
          python -m pytest -q
          --junitxml=openai-luna-junit.xml
          tests/test_openai_luna*.py
          tests/test_openai_ostar_star.py
      - name: Branch coverage gate
        if: matrix.python-version == '3.11'
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          coverage run --branch \
            --source=mcp_client,openai_luna_protocol,openai_luna_runtime,openai_ostar_star,verify_openai_luna \
            -m pytest -q \
            tests/test_openai_luna_unit.py \
            tests/test_openai_luna_contract.py \
            tests/test_openai_luna_property.py \
            tests/test_openai_luna_replay.py \
            tests/test_openai_luna_mutation.py \
            tests/test_openai_luna_security.py \
            tests/test_openai_luna_integration.py \
            tests/test_openai_luna_chaos.py \
            tests/test_openai_luna_verifier.py \
            tests/test_openai_ostar_star.py
          coverage report --fail-under=75
          coverage xml -o openai-luna-coverage.xml
      - name: Build sealed verifier report
        shell: bash
        run: |
          checks=(
            --static-check ruff
            --static-check compileall
            --static-check shell-syntax
          )
          if [[ "${{ matrix.python-version }}" == "3.11" ]]; then
            checks+=(--static-check coverage)
          fi
          python scripts/verify_openai_luna.py \
            --junit openai-luna-junit.xml \
            --output openai-luna-verifier.json \
            --python-version "${{ matrix.python-version }}" \
            "${checks[@]}"
      - name: Upload verification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openai-luna-verification-py${{ matrix.python-version }}
          path: |
            plugins/chatman-ecosystem/openai-luna-junit.xml
            plugins/chatman-ecosystem/openai-luna-verifier.json
            plugins/chatman-ecosystem/openai-luna-coverage.xml
          if-no-files-found: warn
