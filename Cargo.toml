[workspace]
resolver = "2"
members = [
    "crates/ferroplan",
    "crates/ferroplan-cli",
    "crates/ferroplan-bevy",
    "crates/ferroplan-wasm",
    "crates/ferroplan-mcp",
    "crates/ferroplan-sat",
    "crates/ferroplan-hddl",
    "crates/ferroplan-runtime",
]
exclude = ["crates/ferroplan-py", "crucible"]

[workspace.package]
version = "0.29.0"
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"
repository = "https://github.com/seanchatmangpt/ferroplan"
homepage = "https://seanchatmangpt.github.io/ferroplan"
authors = ["Harold Hersey <haroldhhersey@gmail.com>"]
keywords = ["pddl", "planner", "planning", "ai", "heuristic-search"]
categories = ["science", "command-line-utilities", "algorithms"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
